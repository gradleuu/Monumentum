plugins {
    alias(libs.plugins.fabric.loom)
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Xander Maven'
        url = uri('https://maven.isxander.dev/releases')
    }
    maven {
        url = uri('https://maven.terraformersmc.com/')
        content {
            includeGroup('com.terraformersmc')
        }
    }
    maven {
        url = uri('https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1')
        content {
            includeGroup('me.djtheredstoner')
        }
    }
    maven {
        url = uri('https://maven.wispforest.io/releases/')
    }
    maven {
        url = uri('https://maven.shedaniel.me/')
    }
    maven {
        url = uri('https://jitpack.io')
    }
    mavenCentral()
}

def owoVersion = libs.versions.owo.get()

dependencies {
    minecraft("com.mojang:minecraft:${libs.versions.minecraft.get()}")
    mappings("net.fabricmc:yarn:${libs.versions.yarn.mappings.get()}:v2")

    modRuntimeOnly(libs.devauth)
    modImplementation(libs.fabric.loader)
    modImplementation(libs.fabric.api)
    modImplementation(libs.modmenu)
    modImplementation("io.wispforest:owo-lib:${owoVersion}")

    include("io.wispforest:owo-sentinel:${owoVersion}")
}

def resourceProperties = [
        version: project.version,
        minecraft_version: libs.versions.minecraft.get(),
        loader_version: libs.versions.fabric.loader.get()
]

tasks.named('processResources') {
    inputs.properties(resourceProperties)
    filteringCharset = 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand(resourceProperties)
    }
}

def targetJavaVersion = 17

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

java {
    if (JavaVersion.current() < JavaVersion.toVersion(targetJavaVersion)) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    withSourcesJar()
}

tasks.named('jar') {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
